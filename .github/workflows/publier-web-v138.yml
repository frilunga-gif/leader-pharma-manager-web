name: Publier Leader Pharma Manager Pro V1.3.8 Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire Leader Pharma Web V1.3.8
        run: |
          rm -rf extraction site
          mkdir -p extraction site

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'LeaderPharmaManagerPro-WEB-V1.3.8-COMPLETE*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : ZIP WEB V1.3.8 introuvable"
            exit 1
          fi

          echo "ZIP trouve : $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extraction

          INDEX_FILE=$(find extraction -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERREUR : index.html introuvable dans le ZIP"
            find extraction -maxdepth 4 -type f
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX_FILE")

          echo "Application Web trouvee dans : $WEB_DIR"

          cp -R "$WEB_DIR"/. site/

          touch site/.nojekyll

          echo "Contenu pret pour GitHub Pages :"
          ls -la site

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Televerser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier Leader Pharma Manager Pro
        id: deployment
        uses: actions/deploy-pages@v4
